<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-label="AI makes me faster — it doesn't make the decisions. I own every line I ship.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#f89820"/><stop offset=".35" stop-color="#8b5cf6"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
</defs>
<style>
  .card{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .dash{stroke-dasharray:5 6;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}
  .cap{animation:up 1s ease-out 1.6s both}
</style>
<rect x="1" y="1" width="1098" height="328" rx="16" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".08"/>
<text x="34" y="46" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#8b949e">// how I work with AI</text>
<line x1="270" y1="163.0" x2="306" y2="163.0" stroke="#8b949e" stroke-width="2" class="dash" marker-end="url(#ar)"/>
<line x1="546" y1="163.0" x2="582" y2="163.0" stroke="#8b949e" stroke-width="2" class="dash" marker-end="url(#ar)"/>
<line x1="822" y1="163.0" x2="858" y2="163.0" stroke="#8b949e" stroke-width="2" class="dash" marker-end="url(#ar)"/>
<path d="M672.0 86 C662.0 54, 466.0 54, 456.0 84" fill="none" stroke="#8b5cf6" stroke-width="2" class="dash" marker-end="url(#ar)"/>
<text x="564.0" y="58" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b5cf6">↺ iterate</text>
<g class="card" style="animation-delay:0.20s">
  <rect x="34" y="88" width="232" height="150" rx="14" fill="#0b1020" fill-opacity=".85" stroke="#f89820" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="34" y="88" width="232" height="4" rx="2" fill="#f89820"/>
  <text x="52" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#f89820">01</text>
  <rect x="194" y="108" width="54" height="22" rx="11" fill="#f89820" fill-opacity=".15"/>
  <text x="221" y="123" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#f89820">human</text>
  <text x="52" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1" fill="#e6edf3">THINK</text>
  <text x="52" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Understand the domain,</text>
  <text x="52" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">design the solution</text>
</g>
<g class="card" style="animation-delay:0.45s">
  <rect x="310" y="88" width="232" height="150" rx="14" fill="#0b1020" fill-opacity=".85" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="310" y="88" width="232" height="4" rx="2" fill="#8b5cf6"/>
  <text x="328" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8b5cf6">02</text>
  <rect x="432" y="108" width="92" height="22" rx="11" fill="#8b5cf6" fill-opacity=".15"/>
  <text x="478" y="123" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b5cf6">AI copilot</text>
  <text x="328" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1" fill="#e6edf3">ACCELERATE</text>
  <text x="328" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Scaffolding, tests, docs,</text>
  <text x="328" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">automating the boring stuff</text>
</g>
<g class="card" style="animation-delay:0.70s">
  <rect x="586" y="88" width="232" height="150" rx="14" fill="#0b1020" fill-opacity=".85" stroke="#22d3ee" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="586" y="88" width="232" height="4" rx="2" fill="#22d3ee"/>
  <text x="604" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#22d3ee">03</text>
  <rect x="746" y="108" width="54" height="22" rx="11" fill="#22d3ee" fill-opacity=".15"/>
  <text x="773" y="123" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#22d3ee">human</text>
  <text x="604" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1" fill="#e6edf3">REVIEW</text>
  <text x="604" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">I read, test &amp; refactor</text>
  <text x="604" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">every single line</text>
</g>
<g class="card" style="animation-delay:0.95s">
  <rect x="862" y="88" width="232" height="150" rx="14" fill="#0b1020" fill-opacity=".85" stroke="#4ade80" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="862" y="88" width="232" height="4" rx="2" fill="#4ade80"/>
  <text x="880" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#4ade80">04</text>
  <rect x="1007" y="108" width="69" height="22" rx="11" fill="#4ade80" fill-opacity=".15"/>
  <text x="1041" y="123" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#4ade80">CI / PR</text>
  <text x="880" y="162" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1" fill="#e6edf3">SHIP</text>
  <text x="880" y="192" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Commit &amp; PR behind</text>
  <text x="880" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">tests and quality gates</text>
</g>
<line x1="34" y1="260" x2="1066" y2="260" stroke="url(#line)" stroke-width="2" stroke-opacity=".5"/>
<circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M34 260 H1066"/></circle>
<text class="cap" x="550.0" y="302" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#e6edf3">“AI makes me faster — it doesn't make the decisions. I own every line I ship.”</text>
</svg>