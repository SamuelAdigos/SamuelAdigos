<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-label="career timeline">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .seg{animation:fade .5s ease-out both}
  .lab{animation:up .6s ease-out both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(3.2);opacity:0}}
  .draw{stroke-dasharray:1000;animation:draw 1.6s ease-out both}
  @keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
</style>
